# Upstream mermaid-rs-renderer 0.3.1 (https://github.com/1jehuang/mermaid-rs-renderer),
# patched so it runs on wasm32-unknown-unknown: see src/time_compat.rs.
# Used only by crates/md2pdf-wasm via [patch.crates-io].
[package]
edition = "2024"
name = "mermaid-rs-renderer"
version = "0.3.1"
description = "Fast Mermaid diagram renderer in pure Rust (patched for wasm32-unknown-unknown)"
license = "MIT"
repository = "https://github.com/1jehuang/mermaid-rs-renderer"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
cli = ["dep:clap"]
default = ["cli", "png"]
png = ["dep:resvg", "dep:usvg"]

[lib]
name = "mermaid_rs_renderer"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"], optional = true }
fontdb = "0.23"
json5 = "1.3"
once_cell = "1.21.4"
regex = "1.12"
resvg = { version = "0.47.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ttf-parser = "0.25"
usvg = { version = "0.47.0", optional = true }
