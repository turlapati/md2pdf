name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag must match Cargo.toml and package.json versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          npm_v=$(node -p "require('./vscode-extension/package.json').version")
          echo "tag=$tag cargo=$cargo_v npm=$npm_v"
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$npm_v" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo_v) / package.json ($npm_v)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  binaries:
    needs: [check-version, test]
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ext: .exe, platform: win32-x64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, ext: "",   platform: linux-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,     ext: "",   platform: darwin-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      ext: "",   platform: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p md2pdf
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/md2pdf${{ matrix.ext }}" \
             "dist/md2pdf-${{ needs.check-version.outputs.version }}-${{ matrix.platform }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with: { name: "bin-${{ matrix.platform }}", path: dist/* }

  vsix:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "crates/md2pdf-wasm -> target" }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - working-directory: vscode-extension
        run: |
          npm ci
          npm run build:wasm
          npm run package
      - uses: actions/upload-artifact@v7
        with: { name: vsix, path: vscode-extension/*.vsix }

  release:
    needs: [check-version, binaries, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          name: md2pdf v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
