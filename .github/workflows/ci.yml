name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - name: Render kitchen-sink example
        run: cargo run -p md2pdf -- examples/kitchen-sink.md --toc --date 2026-01-15
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with: { name: kitchen-sink-pdf, path: examples/kitchen-sink.pdf }

  golden:
    name: golden visual tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cargo build -p md2pdf
      - name: Compare golden PNGs
        run: bash scripts/golden-test.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-mismatch
          path: testdata/golden-out/
          if-no-files-found: ignore

  extension:
    name: wasm + vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "crates/md2pdf-wasm -> target" }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - working-directory: vscode-extension
        run: |
          npm ci
          npm run build:wasm
          npm run test:wasm
          npm run package
      - uses: actions/upload-artifact@v7
        with: { name: vsix, path: vscode-extension/*.vsix }
