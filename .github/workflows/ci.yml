name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - name: Render kitchen-sink example
        run: cargo run -p md2pdf -- examples/kitchen-sink.md --toc
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with: { name: kitchen-sink-pdf, path: examples/kitchen-sink.pdf }

  extension:
    name: wasm + vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "crates/md2pdf-wasm -> target" }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - working-directory: vscode-extension
        run: |
          npm ci
          npm run build:wasm
          npm run package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: vscode-extension/*.vsix }
